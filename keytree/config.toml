[commands]
back   = "Escape"   # move up a group (or quit at root)
quit   = "q"        # quit immediately from tree mode
search = "/"        # enter dmenu-style PATH search

[layout]
# "ring"   — single ring, two rings when item count reaches dual_ring_threshold
# "spiral" — golden-angle phyllotaxis spiral starting off-center
type = "ring"
# Node shape: "rect" (default) or "circle"
shape = "circle"
# ring mode:   items >= ring_threshold → two rings (default 8)
ring_threshold = 12
# spiral mode: items >= spiral_threshold → spiral layout; else single ring (default 6)
spiral_threshold = 12
# Minimum pixel gap between rectangle bounding boxes along the spiral (spiral mode only).
gap_pixels = 20

[colors]
# Executable nodes — rounded, bright blue border
leaf_bg          = "#E0071520"
leaf_border      = "#4499EE"
# Group/subtree nodes — angular, amber border
group_bg         = "#E01A0C06"
group_border     = "#AA6622"
# Text
key_text         = "#88CCFF"
label_text       = "#DDFFFFFF"
# Radial connector lines (opacity is applied separately in the renderer)
connector        = "#334466"
center_dot       = "#5588CC"
# Search panel
search_bg        = "#E0071520"
search_border    = "#4499EE"
search_selection = "#774499EE"
search_text      = "#AACCFF"

