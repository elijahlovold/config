[colors]
transparent_background_colors = false

[colors.primary]
background = "{{ background }}"
foreground = "{{ foreground }}"

[colors.normal]
black   = "{{ color0 }}"
red     = "{{ color1 }}"
green   = "{{ color2 }}"
yellow  = "{{ color3 }}"
blue    = "{{ color4 }}"
magenta = "{{ color5 }}"
cyan    = "{{ color6 }}"
white   = "#cccccc"

[colors.bright]
black   = "{{ color8 }}"
red     = "{{ color9 }}"
green   = "{{ color10 }}"
yellow  = "{{ color11 }}"
blue    = "{{ color12 }}"
magenta = "{{ color13 }}"
cyan    = "{{ color14 }}"
white   = "#f2f2f2"

[colors.cursor]
cursor = "{{ foreground }}"
text = "{{ background }}"

[colors.selection]
background = "{{ color4 }}"
text = "{{ background }}"
