[manager]
cwd = { fg = "{{color4}}" }

hovered         = { fg = "{{background}}", bg = "{{color4}}" }
preview_hovered = { fg = "{{background}}", bg = "{{color4}}" }

find_keyword  = { fg = "{{color3}}", bold = true }
find_position = { fg = "{{color5}}", bold = true }

marker_copied   = { fg = "{{color2}}", bg = "{{color2}}" }
marker_cut      = { fg = "{{color1}}", bg = "{{color1}}" }
marker_marked   = { fg = "{{color3}}", bg = "{{color3}}" }
marker_selected = { fg = "{{color4}}", bg = "{{color4}}" }

tab_active   = { fg = "{{background}}", bg = "{{color4}}" }
tab_inactive = { fg = "{{foreground}}", bg = "{{color0}}" }

count_copied   = { fg = "{{background}}", bg = "{{color2}}" }
count_cut      = { fg = "{{background}}", bg = "{{color1}}" }
count_selected = { fg = "{{background}}", bg = "{{color4}}" }

border_symbol = "│"
border_style  = { fg = "{{color8}}" }

[status]
separator_open  = ""
separator_close = ""

mode_normal = { fg = "{{background}}", bg = "{{color4}}", bold = true }
mode_select = { fg = "{{background}}", bg = "{{color3}}", bold = true }
mode_unset  = { fg = "{{background}}", bg = "{{color1}}", bold = true }

progress_label  = { fg = "{{foreground}}", bold = true }
progress_normal = { fg = "{{color4}}", bg = "{{color0}}" }
progress_error  = { fg = "{{color1}}", bg = "{{color0}}" }

permissions_t = { fg = "{{color2}}" }
permissions_r = { fg = "{{color3}}" }
permissions_w = { fg = "{{color1}}" }
permissions_x = { fg = "{{color4}}" }
permissions_s = { fg = "{{color5}}" }

[input]
border   = { fg = "{{color4}}" }
title    = { fg = "{{color4}}" }
value    = {}
selected = { fg = "{{background}}", bg = "{{color4}}" }

[select]
border   = { fg = "{{color4}}" }
active   = { fg = "{{color4}}" }
inactive = { fg = "{{foreground}}" }

[tasks]
border  = { fg = "{{color4}}" }
title   = { fg = "{{color4}}" }
hovered = { fg = "{{background}}", bg = "{{color4}}" }

[which]
mask            = { bg = "#000000" }
cand            = { fg = "{{color4}}" }
rest            = { fg = "{{foreground}}" }
desc            = { fg = "{{color8}}" }
separator       = " → "
separator_style = { fg = "{{color8}}" }

[help]
on      = { fg = "{{color2}}" }
run     = { fg = "{{color3}}" }
hovered = { fg = "{{background}}", bg = "{{color4}}" }
footer  = { fg = "{{background}}", bg = "{{color4}}" }

[filetype]

rules = [
    { mime = "image/*", fg = "{{color5}}" },
    { mime = "video/*", fg = "{{color1}}" },
    { mime = "audio/*", fg = "{{color6}}" },
    { mime = "application/zip", fg = "{{color3}}" },
    { mime = "application/x-tar", fg = "{{color3}}" },
]
