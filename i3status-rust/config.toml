# modules at: 
#    https://docs.rs/i3status-rs/latest/i3status_rs/blocks/index.html#modules

[theme]
# theme = "default"
theme = "wallust"

[icons]
icons = "awesome4"
[icons.overrides]
bat = ["|E|", "|_|", "|=|", "|F|"]
bat_charging = "|^| "

##################################
# Extra apps
##################################
[[block]]
block = "music"
format = " $icon {$combo.str(max_w:40)|}"
[[block.click]]
button = "left"
action = "play_pause"
[[block.click]]
button = "forward"
action = "next"
[[block.click]]
button = "back"
action = "prev"

